[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bondpredictor"
version = "0.1.0"
description = "Forecasting bond excess returns (US, Germany, Japan) and inflation (US, UK, Japan, euro area) from public data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.1",
    "requests>=2.28",
]

[project.optional-dependencies]
# xlrd reads the NY Fed ACM and GSCPI workbooks (.xls); openpyxl reads .xlsx overrides.
excel = ["xlrd>=2.0", "openpyxl>=3.1"]
# Random forest, gradient boosting and neural-net forecasters (bond and inflation models).
ml = ["scikit-learn>=1.4", "lightgbm>=4.0", "scipy>=1.10", "torch>=2.2"]
# Tier-2 deep time-series networks and pretrained foundation models for the inflation horse race.
deep = ["neuralforecast>=3.0"]
foundation = ["chronos-forecasting>=2.0", "timesfm @ git+https://github.com/google-research/timesfm.git"]
dev = ["pytest>=7"]

[project.scripts]
bondpredictor = "bondpredictor.cli:main"

[tool.setuptools.packages.find]
include = ["bondpredictor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
